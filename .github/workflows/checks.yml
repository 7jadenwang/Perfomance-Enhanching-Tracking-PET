name: App checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:program
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Private sync PostgreSQL checks
        run: scripts/test-sync-sql.sh
      - name: Two-device sync transport checks
        run: npm run test:e2e -- tests/e2e/sync.spec.ts
        env:
          VITE_SUPABASE_URL: https://pet-sync.example
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_browser_test
